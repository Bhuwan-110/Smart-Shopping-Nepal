{% extends 'base.html' %}

{% block title %}Page Not Found (404) | SmartShopping Nepal{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card p-5 border-0 shadow-sm rounded-3 bg-white mx-auto" style="max-width: 600px;">
        <i class="fa-solid fa-triangle-exclamation text-warning fs-1 mb-3"></i>
        <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">
            The product, store, or page you were looking for doesn't exist or has been moved.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'shopping:home' %}" class="btn btn-primary px-4">Go to Homepage</a>
            <a href="{% url 'shopping:search' %}" class="btn btn-outline-secondary px-4">Search Catalog</a>
        </div>
    </div>
</div>
{% endblock %}
