{% extends 'base.html' %}

{% block title %}Sign In | SmartShopping Nepal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 border-0 shadow rounded-3 bg-white">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-circle-user text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold mb-1">Sign In</h3>
                    <p class="text-muted small">Access your saved wishlist and price drop notifications.</p>
                </div>

                <form method="POST" action="{% url 'shopping:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Sign In</button>
                    <div class="text-center small text-muted">
                        Don't have an account? <a href="{% url 'shopping:register' %}" class="text-primary fw-bold">Register Now</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
