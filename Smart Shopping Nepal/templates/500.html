{% extends 'base.html' %}

{% block title %}Server Error (500) | SmartShopping Nepal{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card p-5 border-0 shadow-sm rounded-3 bg-white mx-auto" style="max-width: 600px;">
        <i class="fa-solid fa-server text-danger fs-1 mb-3"></i>
        <h2 class="fw-bold mb-2">500 - Server Error</h2>
        <p class="text-muted mb-4">
            We encountered an unexpected error processing your request. Our technical team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'shopping:home' %}" class="btn btn-primary px-4">Return to Homepage</a>
            <a href="{% url 'shopping:compare_list' %}" class="btn btn-outline-secondary px-4">Price Comparison</a>
        </div>
    </div>
</div>
{% endblock %}
